version: '3.8'

services:
  mengdong_cloud:
    image: mengdong_cloud:latest
    container_name: mengdong_cloud
    restart: unless-stopped
    
    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Port mappings
    ports:
      - "22266:22266"  # API server
      - "8554:8554"    # RTSP streaming
      - "8080:8080"    # FLV streaming
    
    # Volume mappings
    volumes:
      - ./models:/workspace/models
      - ./logs:/workspace/logs
    
    # Environment variables
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - CUDA_MODULE_LOADING=LAZY
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22266/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: mengdong_network
